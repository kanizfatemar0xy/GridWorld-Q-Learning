name: GridWorld Q-learning - tests and benchmark
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Verify seeded training benchmark
        run: python rl_qlearning.py --episodes 3000 --seed 42 --benchmark-seeds 30
